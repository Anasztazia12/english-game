<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Game</title>
<link rel="icon" href="data:,">

<!-- Playful kid-friendly fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎈 English Game 🎈</h1>

    <!-- home screen -->
    <div id="start-area">
        <button class="btn btn-warning btn-lg" onclick="showDifficultySelect()">🚀 Start Game</button>
    </div>

    <!-- Difficulty  -->
    <div id="difficulty-select" style="display:none;">
        <h2>🎯 Select Difficulty</h2>
        <button class="btn btn-success m-2" onclick="chooseDifficulty('easy')" id="btn-easy">😊 Easy</button>
        <button class="btn btn-warning m-2" onclick="chooseDifficulty('medium')" id="btn-medium">🙂 Medium</button>
        <button class="btn btn-danger m-2" onclick="chooseDifficulty('hard')" id="btn-hard">🤓 Hard</button>
        <div class="mt-3">
            <button class="btn btn-home btn-outline-info" onclick="goHome()">🏠 Home</button>
        </div>
    </div>

    <!-- Tense selection -->
    <div id="tense-select" style="display:none;">
        <h2>⏰ Select Tense</h2>
        <div id="tense-buttons"></div>
        <div class="mt-3">
            <button class="btn btn-back btn-outline-warning" onclick="backToDifficulty()">⬅️ Back</button>
            <button class="btn btn-home btn-outline-info" onclick="goHome()">🏠 Home</button>
        </div>
    </div>

    <!-- Reading text -->
    <div id="text-area" style="display:none;">
        <h2 id="text-title"></h2>
        <p id="reading-text"></p>
        <button class="btn btn-primary m-2" onclick="startFillPractice()">▶️ Start Practice</button>
        <div class="mt-3">
            <button class="btn btn-back btn-outline-warning" onclick="backToTense()">⬅️ Back</button>
            <button class="btn btn-home btn-outline-info" onclick="goHome()">🏠 Home</button>
        </div>
    </div>

    <!-- Game area -->
    <div id="game-area" style="display:none;"></div>
    <!-- Navigation -->
    <div id="game-nav" style="display:none;" class="mt-3">
        <button class="btn btn-back btn-outline-warning" onclick="backToTense()">⬅️ Back</button>
        <button class="btn btn-home btn-outline-info" onclick="goHome()">🏠 Home</button>
    </div>
    <!-- Feedback -->
    <div id="feedback"></div>
    <!-- Final score actions -->
    <div id="final-actions" style="display:none;" class="mt-3">
        <button class="btn btn-success m-2" onclick="backToTense()">🔁 Practice another tense</button>
        <button class="btn btn-home btn-outline-info m-2" onclick="goHome()">🏠 Home</button>
    </div>
    <!-- Next gomb -->
    <button id="next-btn" class="btn btn-primary mt-3" style="display:none;" onclick="nextQuestion()">Next</button>
</div>

<script src="js/english-game.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
